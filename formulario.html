<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body>
    <h1>Sistema de Acesso</h1>
    <div class="form">
        <label>Usuário:</label>
        <input type="text" id="usuario" required placeholder="Digite o seu usuário" autocomplete="off"><br>
        <label>Senha:</label>
        <input type="password" id="senha" placeholder="Digite a sua senha" autocomplete="off"><br>
        <button id="btnAcessar">Acessar</button><br>
        <button id="btnLimpar">Limpar</button><br>
        <h3 id="h3"> </h3>
    </div>
    
    

    <script src="js/formulario.js"></script>
</body>
</html>
